<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="bar">
      <h1>Admin <span>panel</span></h1>
      <a class="btn ghost sm" href="/" style="text-decoration: none"
        >Storefront</a
      ><button class="btn ghost sm" id="out" hidden>Log out</button>
    </div>
    <main>
      <section id="login">
        <h2>Admin login</h2>
        <div style="max-width: 340px">
          <label for="le">Email</label><input id="le" type="email" /><label
            for="lp"
            >Password</label
          ><input id="lp" type="password" />
          <p class="err" id="lerr"></p>
          <button class="btn" id="lbtn">Log in</button>
        </div>
      </section>
      <section id="panel" hidden>
        <div class="stats" id="stats"></div>
        <div class="tabs">
          <button class="tab" data-p="menuP" aria-pressed="true">Menu</button
          ><button class="tab" data-p="ordersP" aria-pressed="false">
            Orders
          </button>
        </div>
        <div id="menuP">
          <div class="row" style="margin-bottom: 12px">
            <h2>Menu items</h2>
            <button class="btn" id="newBtn">Add item</button>
          </div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
        <div id="ordersP" hidden>
          <h2 style="margin-bottom: 12px">Orders</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Order date</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="orows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <dialog id="dlg">
      <form id="f">
        <h2 id="dt">Menu item</h2>
        <img class="prev" id="prev" alt="Image preview" />
        <label for="file">Upload image (JPG, PNG, WebP, max 3 MB)</label
        ><input
          id="file"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        />
        <label for="url">Or image URL / path</label
        ><input id="url" placeholder="/images/menu/paneer-tikka.svg" />
        <label for="nm">Name</label><input id="nm" required /><label for="ds"
          >Description</label
        ><input id="ds" maxlength="300" /> <label for="cat">Category</label
        ><input id="cat" list="cats" required /><datalist id="cats"></datalist>
        <div class="row">
          <div>
            <label for="rt">Rating (0-5)</label
            ><input
              id="rt"
              type="number"
              min="0"
              max="5"
              step="0.1"
              value="4.0"
            />
          </div>
          <div>
            <label for="pt">Prep time (min)</label
            ><input id="pt" type="number" min="1" max="180" value="20" />
          </div>
        </div>
        <label
          ><input type="checkbox" id="vg" style="width: auto" />
          Vegetarian</label
        >
        <div class="row">
          <div>
            <label for="pr">Price (₹)</label
            ><input id="pr" type="number" min="0" step="0.01" required />
          </div>
          <div>
            <label for="st">Stock</label
            ><input id="st" type="number" min="0" step="1" required />
          </div>
        </div>
        <label
          ><input type="checkbox" id="av" style="width: auto" /> Available to
          order</label
        >
        <p class="err" id="ferr"></p>
        <div class="row">
          <button class="btn" type="submit">Save item</button
          ><button class="btn ghost" type="button" id="cancel">Cancel</button>
        </div>
      </form>
    </dialog>
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
